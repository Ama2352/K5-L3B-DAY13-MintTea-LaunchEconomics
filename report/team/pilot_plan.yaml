# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Kế hoạch pilot, chưa phải quyết định mở rộng. Số liệu tính bởi src/pilot_calc.py.
# Kiểm tra đọc được: python3 -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (hệ số thiết kế 1).
#   b) Theo nhân viên, m = 75: hệ số thiết kế 2,48; 3.103 yêu cầu mỗi nhóm; 42 nhân viên mỗi nhóm, tổng 84 > 40 nhân viên: không đủ người.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa 20 / 0,02 = 1.000 < 1.251: không đạt.
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa 6 / 0,02 = 300.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: mỗi nhân viên cần ít nhất 299 yêu cầu (hệ số thiết kế 6,96).
#
# D2 · Năm câu kiểm tra "tách được tác động" (chia theo nhân viên, 20 + 20, phân tầng theo depot)
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot với nhóm dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: có rủi ro nhân viên chia sẻ câu trả lời trong cùng depot; giảm bằng quyền truy cập theo tài khoản và ghi log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trong file này trước ngày bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận: với 40 nhân viên không cách chia theo cụm nào đủ mẫu để thấy mức chênh 5 điểm
#   (tối đa 1.000 < 1.251). Nhóm chấp nhận chỉ phát hiện được mức chênh 6 điểm (859 mỗi nhóm, mỗi nhân viên
#   ít nhất 299 yêu cầu). Nếu tác động thật chỉ là 5 điểm thì power còn khoảng 0,64, nên kết quả "không khác biệt"
#   không được hiểu là "trợ lý không có tác động".
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại: 4,25% (51/1.200); riêng noi_dia + hang_nang là 3,97% (39/982).
#   Ngưỡng an toàn đã chọn: chênh +2 điểm so với nhóm đối chứng, kèm trần tuyệt đối 6%.
#   (Không đặt ngưỡng tuyệt đối 3% vì thấp hơn mức hiện tại, pilot sẽ bị dừng ngay tuần đầu.)
#
# Lịch thu mẫu: lưu lượng ước tính 1.500 yêu cầu/ngày ÷ 40 nhân viên × 81,83% thuộc phạm vi (982/1.200)
#   ≈ 31 yêu cầu/người/ngày. Đạt 299 yêu cầu/người cần khoảng 10 ngày, nên bước 0.50 kéo dài 14 ngày
#   (≈ 430 yêu cầu/người, dư khoảng 40% phòng lưu lượng thấp hơn ước tính).
#   Ca cuối vào 2026-12-28, cộng 7 ngày theo dõi mở lại → đủ dữ liệu ngày 2027-01-04, quyết định 2027-01-05.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang trong 6 depot đã chạy thử. Loại quoc_te (tỉ lệ thành công 27,33%, 22.515 đ mỗi việc thành công, simulated) và doi_tac (54,41%, 10.215 đ, simulated) đưa ra khỏi pilot, giao nhân viên xử lý."
  assignment:
    unit: "staff"                 # request | staff | depot
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 → 10 → 20 nhân viên; chỉ đo chỉ số chính ở bước 0.50
  schedule:
    step_0_10: "2026-12-01 đến 2026-12-07"
    step_0_25: "2026-12-08 đến 2026-12-14"
    step_0_50_measurement: "2026-12-15 đến 2026-12-28 (14 ngày, chỉ tiêu 5.980 yêu cầu thực tế mỗi nhóm = 20 × 299)"
    follow_up_end: "2027-01-04 (ca cuối đủ 7 ngày theo dõi mo_lai_trong_7_ngay)"
    step_criteria: "Chỉ sang bước kế tiếp khi trong bước hiện tại không luật dừng nào kích hoạt và mọi event có trace_id ghi đủ ≥ 95% yêu cầu; Giám đốc vận hành ký chuyển bước"
    shortfall: "Nếu đến 2026-12-28 nhóm nào dưới 5.980 yêu cầu, Giám đốc vận hành kéo dài bước 0.50 tối đa 7 ngày và lùi decision_date tương ứng; không đọc kết quả sớm"
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận, xem chú thích đầu file
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng chạy cùng tuần, cùng depot, chỉ không dùng trợ lý."
    spillover_risk: "Có: nhân viên chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id."
    predeclared: "Có: chỉ số chính, ngưỡng, luật dừng và ngày quyết định chốt trong file này trước ngày bắt đầu."
  stop_rules:
    - "NẾU tỉ lệ mo_lai_trong_7_ngay của nhóm dùng trợ lý cao hơn nhóm đối chứng quá 2 điểm hoặc vượt trần tuyệt đối 6% TRONG 3 ngày liên tiếp THÌ Kỹ sư trưởng agent tắt trợ lý cho nhóm dùng và trả yêu cầu về nhân viên trong vòng 4 giờ KHÔNG THÌ không được tăng sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công (simulated) của phạm vi pilot vượt 12.000 đ, bằng mức nhân viên tự làm, TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí dừng mở rộng và rà lại số lần xem lại và làm lại KHÔNG THÌ không được tăng tỉ lệ rollout"
    - "NẾU dưới 50% nhân viên nhóm dùng mở trợ lý cho yêu cầu thuộc phạm vi TRONG 2 tuần liên tiếp THÌ Trưởng nhóm CSKH phỏng vấn nhân viên và giữ nguyên bước rollout hiện tại KHÔNG THÌ không được kết luận hiệu quả của trợ lý từ nhóm đó"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Kỹ sư trưởng agent bấm tắt cờ tính năng trong vòng 4 giờ; yêu cầu mới của nhóm dùng được nhân viên CSKH xử lý thủ công như trước pilot, yêu cầu đang xử lý chuyển cho nhân viên."
  decision_date: "2027-01-05"     # sau khi ca cuối (2026-12-28) đủ 7 ngày theo dõi
  simulated_inputs: ["phut_xem_lai_simulated", "phut_lam_lai_simulated", "chi phí mỗi việc thành công theo loại yêu cầu (A3)", "baseline nhân viên tự làm 6 phút = 12.000 đ"]
